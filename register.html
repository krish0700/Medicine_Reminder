<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>
body{
    background:linear-gradient(120deg,#43e97b,#38f9d7);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}
.box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
h2{
    text-align:center;
}
input,button{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    background:#43e97b;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#2ecc71;
}
a{
    display:block;
    text-align:center;
    margin-top:10px;
    text-decoration:none;
    color:#333;
}
</style>
</head>

<body>
<div class="box">
    <h2>Create Account</h2>

    {% if error %}
        <p style="color:red;text-align:center;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

    <a href="{{ url_for('index') }}">Already have an account? Login</a>
</div>
</body>
</html>
