<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            width: 300px;
            text-align: center;
        }
        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .profile-card h2 {
            margin: 10px 0;
        }
        .profile-card p {
            margin: 5px 0;
            font-size: 16px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Paste your profile card here -->
    <div class="profile-card">
        <img src="{{ user.photo }}" alt="Profile Photo">
        <h2>{{ user.full_name }}</h2>  <!-- Name -->
        <p><strong>Mobile:</strong> {{ user.mobile }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Gender:</strong> {{ user.gender }}</p>
        <p><strong>Weight:</strong> {{ user.weight }}</p>
        <a class="back-btn" href="/dashboard">Back to Dashboard</a>
    </div>
</body>
</html>
